<!DOCTYPE html>
<html lang="en">
<head>
    <link href='https:/unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/css/login.css"> <!-- Sử dụng chung style form với login/register -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu</title>
    <link rel="icon" type="image/png" href="/image/logo.png">
</head>
<body>
    <section class="login-section">
        <div class="login-wrapper">
            <!-- Form yêu cầu gửi mã xác thực khôi phục mật khẩu qua Email -->
            <form id="forgot-form">
                <h1>Quên mật khẩu</h1>
                <p style="color: #cbd5e1; font-size: 14px; text-align: center; margin-bottom: 20px;">
                    Nhập email đã đăng ký của bạn. Chúng tôi sẽ gửi mã xác thực (hoặc liên kết) để bạn đặt lại mật khẩu mới.
                </p>
                
                <div class="input-box">
                    <input type="email" id="forgot-email" placeholder="Nhập email của bạn" required>
                    <i class='bx bxs-envelope'></i>
                </div>

                <p id="forgot-message" role="status" aria-live="polite"></p>

                <button type="submit" class="login-button">Gửi mã xác thực</button>

                <div class="register-link">
                    <p>Đã nhớ lại mật khẩu?
                        <a href="/login.html">Đăng nhập ngay!</a>
                    </p>
                </div>
            </form>
        </div>
    </section>
<!-- Sử dụng file JS xử lý logic gửi yêu cầu Supabase -->
<script type="module" src="/js/forgot-password.js"></script>
</body>
</html>
