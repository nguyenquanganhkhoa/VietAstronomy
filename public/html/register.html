<!DOCTYPE html>
<html lang="en">
<head>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/register.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Kí</title>
    <link rel="icon" type="image/png" href="../image/logo.png">
    <!-- Styles are scoped to the password feedback so the existing register design stays intact. -->
</head>
<body>
    <section class="register-section">
    <div class="register-wrapper">
        <form id="register-form" action="">
            <h1>Đăng Kí</h1>
            <div class="input-box">
                <input type="text" id="register-name" placeholder="Tên của bạn" required>
                <i class='bx bxs-user'></i>
            </div>
            <div class="input-box">
                <input type="email" id="register-email" placeholder="Email" required>
                <i class='bx bxs-envelope'></i>
            </div>
            <div class="input-box">
                <input
                    type="password" 
                    id="register-password" 
                    placeholder="Mật khẩu" 
                    autocomplete="new-password" 
                    aria-describedby="password-strength-label 
                    password-strength-rules" required
                    >
                <i class='bx bxs-lock-alt'></i>
            </div>

            <div class="password-strength" aria-live="polite">
                <div class="password-strength__heading">
                    <span>Độ mạnh mật khẩu</span>
                    <span id="password-strength-label">Chưa nhập mật khẩu</span>
                </div>
                <div
                    class="password-strength__track"
                    role="progressbar"
                    aria-label="Độ mạnh mật khẩu"
                    aria-valuemin="0"
                    aria-valuemax="5"
                    aria-valuenow="0"
                    id="password-strength-progress"
                >
                    <div id="password-strength-fill"></div>
                </div>
                <ul class="password-strength__rules" id="password-strength-rules">
                    <li class="password-strength__rule" data-password-rule="length">
                        <span class="password-strength__rule-icon" aria-hidden="true">○</span>
                        <span>Ít nhất 8 ký tự</span>
                    </li>
                    <li class="password-strength__rule" data-password-rule="uppercase">
                        <span class="password-strength__rule-icon" aria-hidden="true">○</span>
                        <span>Có ít nhất 1 chữ in hoa (A-Z)</span>
                    </li>
                    <li class="password-strength__rule" data-password-rule="lowercase">
                        <span class="password-strength__rule-icon" aria-hidden="true">○</span>
                        <span>Có ít nhất 1 chữ thường (a-z)</span>
                    </li>
                    <li class="password-strength__rule" data-password-rule="number">
                        <span class="password-strength__rule-icon" aria-hidden="true">○</span>
                        <span>Có ít nhất 1 chữ số (0-9)</span>
                    </li>
                    <li class="password-strength__rule" data-password-rule="special">
                        <span class="password-strength__rule-icon" aria-hidden="true">○</span>
                        <span>Có ít nhất 1 ký tự đặc biệt (ví dụ: ! @ # $ %)</span>
                    </li>
                </ul>
            </div>

            <div class="input-box">
                <input
                    type="password"
                    id="register-confirm-password"
                    placeholder="Xác nhận mật khẩu"
                    autocomplete="new-password"
                    required
                >
                <i class='bx bxs-lock-alt'></i>
            </div>

            <div class="remember-forgot">
                <label><input type="checkbox" id="register-remember">Ghi nhớ tôi</label>
            </div>

            <p id="register-message" role="status" aria-live="polite"></p>

            <button type="submit" class="register-button">Đăng Kí</button>

            <div class="login-link">
                <p>Đã có tài khoản?
                    <a href="login.html">Đăng nhập ngay!</a>
                </p>
            </div>
        </form>
    </div>
    </section>
<script type="module" src="../js/register.js"></script>
</body>
</html>
