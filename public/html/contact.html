<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/contact.css">
    <title>VietAstronomy</title>
    <link rel="icon" type="image/png" href="../image/logo.png">
</head>
<body>
    <div id="navbar-container"></div>
    <section class="contact-section">
        <h1>Liên hệ</h1>
    </section>
    <div class="contact-container">
        <form id="contact-form" class="contact-left">
            <div class="contact-left-title">
                <h2>Đóng góp ý kiến cho VietAstronomy tại đây</h2>
                <hr>
            </div>
            <input type="hidden" name="access_key" value="fac2828f-09bb-4a2d-a77a-d2a061be9d3e">
            <input type="text" name="name" placeholder="Tên của bạn" class="contact-inputs" required>
            <input type="email" name="email" placeholder="Email của bạn" class="contact-inputs" required>
            <textarea name="message" placeholder="Your Message" class="contact-inputs" required></textarea> 
            <button type="submit">Submit<img src="../image/fast-forward.png" class="contact-button" alt=""></button>
        </form>
        <div class="contact-right">
            <img src="../image/Contact.webp" alt="Hãy liên hệ với chúng tôi nếu bạn có câu hỏi hoặc góp ý gì nhé!">
        </div>
    </div>
    <div id="footer-container"></div>
<script src="../js/main.js"></script>
<script src="../js/contact.js"></script>
</body>
</html>
